# =============================================================================
# Redis Production Configuration
# =============================================================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
# Set maxmemory based on your deployment (e.g., 256mb, 512mb, 1gb)
maxmemory 256mb

# Eviction policy: volatile-lru evicts keys with TTL set (sessions, cache)
# while preserving keys without TTL
maxmemory-policy volatile-lru

# Persistence (AOF for durability)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (as a backup alongside AOF)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Slow log (queries taking more than 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Latency monitoring (track events > 5ms)
latency-monitor-threshold 5

# Active defragmentation
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
