name: E2E Tests

on:
  # E2E is not yet implemented — there is no Playwright config or tests in the
  # repo yet, so this job cannot pass. Manual-only (workflow_dispatch) so it
  # doesn't fail on every PR. To enable it: add @playwright/test, a
  # playwright.config.ts with a webServer that builds + starts backend and
  # frontend, real specs, then restore the `pull_request` trigger below.
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: webapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/webapp_e2e
      BETTER_AUTH_SECRET: test-secret-key-for-ci-testing-only-min-32-chars
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: ''
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/backend

      - name: Run database migrations
        # Use the npm script so Prisma resolves --schema=src/prisma/schema.prisma;
        # `npx --workspace` doesn't change cwd, so raw prisma can't find the schema.
        run: npm run db:migrate:prod --workspace=apps/backend

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
